<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Support CMS | TrueVisions NOW</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: { colors: { magenta: { 300:'#f97dbe',400:'#f542a8',500:'#e91e8c',600:'#d6007d',700:'#b5006a' } } } }
}
</script>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f4f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; color: #1f2937; }
input[type=text], input[type=password], select, textarea {
  width: 100%; border: 1px solid #e5e7eb; border-radius: 8px; padding: 9px 12px;
  font-size: 13px; color: #1f2937; outline: none; font-family: inherit; background: #fff;
}
input:focus, select:focus, textarea:focus { border-color: #e91e8c; box-shadow: 0 0 0 3px rgba(233,30,140,0.08); }
textarea { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12.5px; line-height: 1.6; resize: vertical; }
label { font-size: 11px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; display: block; margin-bottom: 5px; margin-top: 14px; }
label:first-child { margin-top: 0; }
.btn { border: none; border-radius: 8px; padding: 9px 18px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all .15s; }
.btn-primary { background: #e91e8c; color: #fff; }
.btn-primary:hover { background: #d6007d; }
.btn-primary:disabled { background: #f0a8ce; cursor: default; }
.btn-secondary { background: #f3f4f6; color: #374151; }
.btn-secondary:hover { background: #e5e7eb; }
.btn-danger { background: #fee2e2; color: #dc2626; }
.btn-danger:hover { background: #fecaca; }
.toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 20px rgba(0,0,0,.15); z-index: 9999; transform: translateY(80px); opacity: 0; transition: all .3s; pointer-events: none; }
.toast.show { transform: translateY(0); opacity: 1; }
.toast.ok { background: #10b981; color: #fff; }
.toast.err { background: #dc2626; color: #fff; }
.block-card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px 14px; background: #fafafa; }
.block-card + .block-card { margin-top: 10px; }
.block-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.block-label { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: #9ca3af; }
.block-controls button { background: none; border: none; cursor: pointer; color: #9ca3af; font-size: 14px; padding: 2px 6px; }
.block-controls button:hover:not(:disabled) { color: #374151; }
.block-controls button:disabled { cursor: default; }
.rte { min-height: 44px; border: 1px solid #e5e7eb; border-radius: 8px; padding: 9px 12px; font-size: 13px; line-height: 1.6; background: #fff; }
.rte:focus { border-color: #e91e8c; box-shadow: 0 0 0 3px rgba(233,30,140,.08); outline: none; }
.rte:empty:before { content: attr(data-placeholder); color: #9ca3af; }
.rte strong, .rte b { color: #1f2937 !important; } /* stored markup targets the dark live site; keep it legible while editing */
.rte-toolbar { display: flex; gap: 4px; margin-bottom: 6px; }
.rte-toolbar button { border: 1px solid #e5e7eb; background: #fff; border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.rte-toolbar button:hover { background: #f3f4f6; }
.step-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.step-row input { flex: 1; }
.step-row button { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 15px; padding: 2px 6px; }
.step-row button:hover { color: #dc2626; }
.lang-tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 14px 9px; font-size: 12.5px; font-weight: 700; color: #9ca3af; cursor: pointer; margin-bottom: -1px; }
.lang-tab:hover { color: #374151; }
.lang-tab.active { color: #e91e8c; border-bottom-color: #e91e8c; }
.lang-tab .lang-tab-badge { display: inline-block; margin-left: 5px; font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; border-radius: 999px; padding: 1px 6px; vertical-align: middle; }
</style>
</head>
<body>

<!-- ================================================================
     PASSWORD GATE — client-side only for UX. The real check happens
     server-side in /api/save-article on every save/delete; this just
     avoids showing the editor to someone who obviously doesn't have
     the password. Don't treat this screen as real security.
================================================================ -->
<div id="gate" style="position:fixed;inset:0;background:#0a0a12;display:flex;align-items:center;justify-content:center;z-index:100;">
  <div style="width:100%;max-width:340px;padding:0 20px;">
    <div style="text-align:center;margin-bottom:24px;">
      <div style="display:inline-flex;align-items:center;gap:8px;background:rgba(233,30,140,.12);border:1px solid rgba(233,30,140,.25);border-radius:999px;padding:5px 16px;margin-bottom:14px;">
        <span style="width:6px;height:6px;border-radius:50%;background:#e91e8c;display:inline-block;"></span>
        <span style="color:#e91e8c;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;">Support CMS</span>
      </div>
      <h1 style="color:#fff;font-size:22px;font-weight:800;margin:0;">TrueVisions NOW</h1>
      <p style="color:#6b7280;font-size:13px;margin:4px 0 0;">Support article editor</p>
    </div>
    <input id="gate-pw" type="password" placeholder="Password" style="background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#fff;margin-bottom:10px;">
    <button id="gate-btn" class="btn btn-primary" style="width:100%;padding:11px;">Enter</button>
    <p id="gate-hint" style="color:#6b7280;font-size:11px;text-align:center;margin-top:10px;">Password is checked when you save your first change.</p>
  </div>
</div>

<!-- ================================================================
     MAIN CMS UI
================================================================ -->
<div id="app" style="display:none;">
  <div style="background:#0a0a12;border-bottom:1px solid rgba(255,255,255,.08);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="width:8px;height:8px;border-radius:50%;background:#e91e8c;"></span>
      <span style="color:#fff;font-weight:800;font-size:14px;">TVN Support CMS</span>
    </div>
    <a href="support.html" style="color:#9ca3af;font-size:12.5px;text-decoration:none;">View live support site &rarr;</a>
  </div>

  <div style="max-width:900px;margin:0 auto;padding:24px 20px 80px;">
    <div style="display:flex;gap:10px;margin-bottom:18px;">
      <input id="search" type="text" placeholder="Search articles by title or slug…" style="flex:1;">
      <button id="new-btn" class="btn btn-primary" style="white-space:nowrap;">+ New Article</button>
    </div>

    <div id="list"></div>
  </div>
</div>

<!-- ================================================================
     EDITOR PANEL
================================================================ -->
<div id="editor-wrap" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:14px;width:100%;max-width:680px;max-height:calc(100vh - 40px);overflow-y:auto;">
    <div style="padding:18px 22px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;">
      <span id="editor-heading" style="font-weight:800;font-size:15px;">Edit Article</span>
      <button id="editor-close" style="background:none;border:none;cursor:pointer;color:#9ca3af;font-size:20px;line-height:1;">&times;</button>
    </div>
    <div style="padding:22px;">
      <label>Slug <span style="font-weight:400;text-transform:none;color:#9ca3af;">(lowercase, hyphens only — e.g. account-cancel)</span></label>
      <input id="f-slug" type="text" placeholder="e.g. account-cancel">

      <label>Category</label>
      <select id="f-catslug">
        <option value="account">Account &amp; Billing</option>
        <option value="plans">Packages &amp; Plans</option>
        <option value="streaming">Streaming &amp; Playback</option>
        <option value="devices">Devices &amp; Apps</option>
        <option value="downloads">Downloads &amp; Offline</option>
        <option value="parental">Parental Controls</option>
      </select>

      <label>Related articles <span style="font-weight:400;text-transform:none;color:#9ca3af;">(comma-separated slugs, shown at the bottom of the article)</span></label>
      <input id="f-related" type="text" placeholder="account-payment, account-invoices">

      <div id="lang-tabs" style="display:flex;gap:4px;margin-top:22px;border-bottom:1px solid #e5e7eb;">
        <button type="button" class="lang-tab" data-lang="en">English</button>
        <button type="button" class="lang-tab" data-lang="th">ภาษาไทย</button>
      </div>

      <label>Title</label>
      <input id="f-title" type="text" placeholder="Question as it appears to users">

      <label>Content <span style="font-weight:400;text-transform:none;color:#9ca3af;">(built from simple blocks — no code needed)</span></label>
      <div id="f-blocks" style="margin-bottom:10px;"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button type="button" class="btn btn-secondary" style="padding:6px 12px;font-size:11.5px;" data-add="p">+ Paragraph</button>
        <button type="button" class="btn btn-secondary" style="padding:6px 12px;font-size:11.5px;" data-add="h2">+ Heading</button>
        <button type="button" class="btn btn-secondary" style="padding:6px 12px;font-size:11.5px;" data-add="steps">+ Numbered Steps</button>
        <button type="button" class="btn btn-secondary" style="padding:6px 12px;font-size:11.5px;" data-add="tip">+ Tip Box</button>
        <button type="button" class="btn btn-secondary" style="padding:6px 12px;font-size:11.5px;" data-add="note">+ Note Box</button>
        <button type="button" class="btn btn-secondary" style="padding:6px 12px;font-size:11.5px;" data-add="image">+ Image</button>
        <button type="button" class="btn btn-secondary" style="padding:6px 12px;font-size:11.5px;color:#9ca3af;" data-add="raw">+ Custom HTML (advanced)</button>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid #f3f4f6;">
        <button id="f-delete" class="btn btn-danger">Delete Article</button>
        <div style="display:flex;gap:8px;">
          <button id="f-preview" class="btn btn-secondary">Preview</button>
          <button id="f-save" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Preview panel — renders the body HTML roughly as it'll look on the article page -->
<div id="preview-wrap" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#0a0a16;border-radius:14px;width:100%;max-width:680px;max-height:calc(100vh - 40px);overflow-y:auto;padding:32px;">
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
      <button id="preview-close" style="background:none;border:none;cursor:pointer;color:#9ca3af;font-size:20px;line-height:1;">&times;</button>
    </div>
    <h1 id="preview-title" style="color:#fff;font-size:26px;font-weight:800;margin:0 0 20px;"></h1>
    <div id="preview-body" style="color:#d1d5db;font-size:14.5px;line-height:1.7;"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
var PASSWORD = null;
var ARTICLES = {};
var editingSlug = null; // null = creating new

/* Articles are bilingual: { catSlug, related, en:{title,body}, th:{title,body} }.
   The editor keeps both languages' title/blocks in memory at once (titleByLang /
   blocksByLang) so switching tabs doesn't lose what you typed in the other one;
   `blocks` is just a live reference to whichever language tab is active, since
   the block-editing functions below were written against a single global array. */
var titleByLang = { en: '', th: '' };
var blocksByLang = { en: [], th: [] };
var editLang = 'en';
var blocks = blocksByLang.en;

var CAT_LABELS = {
  account: 'Account & Billing', plans: 'Packages & Plans', streaming: 'Streaming & Playback',
  devices: 'Devices & Apps', downloads: 'Downloads & Offline', parental: 'Parental Controls'
};

function esc(s) { return (s || '').replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function showToast(msg, ok) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (ok ? 'ok' : 'err');
  setTimeout(function() { t.className = 'toast ' + (ok ? 'ok' : 'err'); }, 2600);
}

/* ── Gate ─────────────────────────────────────────────────────────── */
document.getElementById('gate-btn').addEventListener('click', enterGate);
document.getElementById('gate-pw').addEventListener('keydown', function(e) { if (e.key === 'Enter') enterGate(); });
function enterGate() {
  var pw = document.getElementById('gate-pw').value;
  if (!pw) return;
  PASSWORD = pw;
  try { sessionStorage.setItem('tvn_cms_pw', pw); } catch (e) {}
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadArticles();
}
(function() {
  try {
    var saved = sessionStorage.getItem('tvn_cms_pw');
    if (saved) {
      PASSWORD = saved;
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadArticles();
    }
  } catch (e) {}
})();

/* ── Load + render article list ──────────────────────────────────── */
function loadArticles() {
  fetch('articles.json?v=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) { ARTICLES = data; renderList(); })
    .catch(function(err) { showToast('Failed to load articles.json: ' + err.message, false); });
}

function renderList(filter) {
  var wrap = document.getElementById('list');
  var f = (filter || document.getElementById('search').value || '').trim().toLowerCase();
  var groups = {};
  Object.keys(ARTICLES).forEach(function(slug) {
    var a = ARTICLES[slug];
    var title = (a.en && a.en.title) || slug;
    if (f && (slug + ' ' + title).toLowerCase().indexOf(f) === -1) return;
    var key = a.catSlug || 'other';
    if (!groups[key]) groups[key] = [];
    groups[key].push({ slug: slug, title: title });
  });

  var order = ['account', 'plans', 'streaming', 'devices', 'downloads', 'parental'];
  var html = '';
  order.forEach(function(catSlug) {
    var items = groups[catSlug];
    if (!items || !items.length) return;
    items.sort(function(a, b) { return a.title.localeCompare(b.title); });
    html += '<div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:14px;">'
      + '<div style="padding:10px 16px;background:#f9fafb;border-bottom:1px solid #e5e7eb;font-size:12px;font-weight:800;color:#111;text-transform:uppercase;letter-spacing:.05em;">' + esc(CAT_LABELS[catSlug]) + ' <span style="color:#9ca3af;font-weight:600;">(' + items.length + ')</span></div>';
    items.forEach(function(item) {
      html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-bottom:1px solid #f3f4f6;">'
        + '<div style="flex:1;min-width:0;">'
        + '<div style="font-size:13px;color:#374151;">' + esc(item.title) + '</div>'
        + '<div style="font-size:11px;color:#9ca3af;font-family:monospace;margin-top:1px;">' + esc(item.slug) + '</div>'
        + '</div>'
        + '<button class="btn btn-secondary" style="padding:6px 14px;font-size:12px;flex-shrink:0;" data-slug="' + esc(item.slug) + '">Edit</button>'
        + '</div>';
    });
    html += '</div>';
  });
  if (!html) html = '<div style="text-align:center;padding:40px;color:#9ca3af;font-size:13px;">No articles match "' + esc(f) + '"</div>';
  wrap.innerHTML = html;
}
document.getElementById('search').addEventListener('input', function() { renderList(); });
document.getElementById('list').addEventListener('click', function(e) {
  var btn = e.target.closest('button[data-slug]');
  if (btn) openEditor(btn.getAttribute('data-slug'));
});

/* ── Editor ───────────────────────────────────────────────────────── */
document.getElementById('new-btn').addEventListener('click', function() { openEditor(null); });
document.getElementById('editor-close').addEventListener('click', closeEditor);
window.openEditor = function(slug) {
  editingSlug = slug;
  var a = (slug && ARTICLES[slug]) || {};
  document.getElementById('editor-heading').textContent = slug ? 'Edit Article' : 'New Article';
  document.getElementById('f-slug').value = slug || '';
  document.getElementById('f-slug').readOnly = !!slug;
  document.getElementById('f-slug').style.background = slug ? '#f3f4f6' : '#fff';
  document.getElementById('f-catslug').value = a.catSlug || 'account';
  document.getElementById('f-related').value = (a.related || []).join(', ');

  titleByLang = { en: (a.en && a.en.title) || '', th: (a.th && a.th.title) || '' };
  blocksByLang = {
    en: slug ? parseBodyToBlocks((a.en && a.en.body) || '') : [newBlock('p')],
    th: slug ? parseBodyToBlocks((a.th && a.th.body) || '') : [newBlock('p')],
  };
  activateLangTab('en');

  document.getElementById('f-delete').style.display = slug ? 'inline-block' : 'none';
  document.getElementById('editor-wrap').style.display = 'flex';
};
function closeEditor() {
  document.getElementById('editor-wrap').style.display = 'none';
  editingSlug = null;
}

/* ── Language tabs ────────────────────────────────────────────────
   Switching tabs swaps which language's title/blocks the shared Title
   input and block editor are pointed at. Nothing is lost when you
   switch away — titleByLang/blocksByLang hold both languages at once.
   activateLangTab() just points the UI at a language (used when opening
   the editor, where there's no "previous tab" to capture from yet);
   setEditLang() is for the tab-click handler, which additionally saves
   whatever was just typed in the outgoing tab before switching. */
function activateLangTab(lang) {
  editLang = lang;
  blocks = blocksByLang[lang];
  document.getElementById('f-title').value = titleByLang[lang];
  document.querySelectorAll('.lang-tab').forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
  });
  renderBlocks();
}
function setEditLang(lang) {
  titleByLang[editLang] = document.getElementById('f-title').value;
  activateLangTab(lang);
}
document.querySelectorAll('.lang-tab').forEach(function(btn) {
  btn.addEventListener('click', function() { setEditLang(btn.getAttribute('data-lang')); });
});
document.getElementById('f-title').addEventListener('input', function() {
  titleByLang[editLang] = document.getElementById('f-title').value;
});

/* ── Block editor ─────────────────────────────────────────────────
   Support-team editors work with plain-text blocks (Paragraph, Heading,
   Numbered Steps, Tip, Note) instead of raw HTML. Each block serializes
   to the same HTML templates the old insertSnippet buttons used to
   paste in, so support.html's rendering doesn't need to change at all.
   A "Custom HTML (advanced)" block is kept as an escape hatch for the
   handful of existing articles with tables/icons that don't fit the
   simple block types — content is preserved verbatim, not lost.
──────────────────────────────────────────────────────────────────── */
var BLOCK_LABELS = { p: 'Paragraph', h2: 'Heading', steps: 'Numbered Steps', tip: 'Tip Box', note: 'Note Box', image: 'Image', raw: 'Custom HTML (advanced)' };

function newBlock(type) {
  if (type === 'p') return { type: 'p', html: '' };
  if (type === 'h2') return { type: 'h2', text: '' };
  if (type === 'steps') return { type: 'steps', items: ['', ''], start: 1 };
  if (type === 'tip') return { type: 'tip', text: '' };
  if (type === 'note') return { type: 'note', text: '' };
  if (type === 'image') return { type: 'image', src: '', alt: '', uploading: false };
  return { type: 'raw', html: '' };
}

// Whitelist sanitizer for paragraph rich text — only bold/italic/link survive.
function sanitizeInline(html) {
  var ALLOWED = { B: 'strong', STRONG: 'strong', I: 'em', EM: 'em', A: 'a', BR: 'br' };
  var src = document.createElement('div');
  src.innerHTML = html || '';
  function clean(node) {
    var out = document.createDocumentFragment();
    node.childNodes.forEach(function(child) {
      if (child.nodeType === 3) {
        out.appendChild(child.cloneNode());
      } else if (child.nodeType === 1) {
        var mapped = ALLOWED[child.tagName];
        if (mapped) {
          var el = document.createElement(mapped);
          if (mapped === 'strong') {
            el.setAttribute('class', 'text-white');
          } else if (mapped === 'a') {
            var href = child.getAttribute('href') || '#';
            if (!/^https?:\/\//i.test(href) && !/^#/.test(href) && !/^mailto:/i.test(href)) href = '#';
            el.setAttribute('href', href);
            el.setAttribute('class', 'text-magenta-400 hover:underline');
          }
          el.appendChild(clean(child));
          out.appendChild(el);
        } else {
          out.appendChild(clean(child)); // unwrap disallowed tag, keep its children
        }
      }
    });
    return out;
  }
  var wrap = document.createElement('div');
  wrap.appendChild(clean(src));
  return wrap.innerHTML;
}

// Step/Tip/Note fields are plain text, but 43 of 46 existing step-lists rely on
// mid-sentence bold. Rather than give every plain-text field a rich toolbar,
// support a lightweight **bold** / [text](url) convention (familiar from Slack/
// WhatsApp) so that formatting survives a round-trip without exposing HTML.
function htmlToMdLite(node) {
  var out = '';
  node.childNodes.forEach(function(child) {
    if (child.nodeType === 3) {
      out += child.textContent;
    } else if (child.nodeType === 1) {
      var tag = child.tagName;
      if (tag === 'STRONG' || tag === 'B') {
        out += '**' + htmlToMdLite(child) + '**';
      } else if (tag === 'A') {
        out += '[' + htmlToMdLite(child) + '](' + (child.getAttribute('href') || '#') + ')';
      } else {
        out += htmlToMdLite(child); // unwrap unknown inline tags, keep their text
      }
    }
  });
  return out;
}
function mdLiteToHtml(text) {
  var out = esc(text || '');
  out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_, label, href) {
    href = href.trim();
    if (!/^https?:\/\//i.test(href) && !/^#/.test(href) && !/^mailto:/i.test(href)) href = '#';
    return '<a href="' + href + '" class="text-magenta-400 hover:underline">' + label + '</a>';
  });
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong class="text-white">$1</strong>');
  return out;
}

// Best-effort: turn an existing article's stored HTML body into editable blocks.
function parseBodyToBlocks(bodyHtml) {
  var src = document.createElement('div');
  src.innerHTML = bodyHtml || '';
  var out = [];
  Array.prototype.forEach.call(src.children, function(el) {
    var tag = el.tagName;
    if (tag === 'P' && !el.querySelector('svg,table,ol,div')) {
      out.push({ type: 'p', html: sanitizeInline(el.innerHTML) });
    } else if (tag === 'H2') {
      out.push({ type: 'h2', text: el.textContent.trim() });
    } else if (tag === 'OL') {
      var lis = el.querySelectorAll('li');
      var items = Array.prototype.map.call(lis, function(li) {
        var spans = li.querySelectorAll('span');
        var last = spans.length ? spans[spans.length - 1] : li;
        return htmlToMdLite(last).trim();
      });
      // A few articles split one step sequence across two <ol> lists (e.g. an
      // embedded screenshot in between), where the second list continues the
      // numbering (4, 5…) instead of restarting at 1 — preserve that.
      var firstBadge = lis.length ? lis[0].querySelector('span') : null;
      var startNum = firstBadge && /^\d+$/.test((firstBadge.textContent || '').trim()) ? parseInt(firstBadge.textContent, 10) : 1;
      out.push({ type: 'steps', items: items.length ? items : [''], start: startNum });
    } else if (tag === 'DIV' && boxKind(el) === 'tip') {
      out.push({ type: 'tip', text: boxText(el) });
    } else if (tag === 'DIV' && boxKind(el) === 'note') {
      out.push({ type: 'note', text: boxText(el) });
    } else if (tag === 'IMG') {
      out.push({ type: 'image', src: el.getAttribute('src') || '', alt: el.getAttribute('alt') || '', uploading: false });
    } else {
      out.push({ type: 'raw', html: el.outerHTML });
    }
  });
  return out.length ? out : [newBlock('p')];
}
function boxKind(el) {
  var p = el.querySelector(':scope > p');
  var t = p ? (p.textContent || '').trim().toLowerCase() : '';
  return (t === 'tip' || t === 'note') ? t : null;
}
function boxText(el) {
  var ps = el.querySelectorAll(':scope > p');
  return ps.length > 1 ? htmlToMdLite(ps[1]).trim() : '';
}

// Assemble the stored article body HTML from the current block list.
function serializeBlocksToHtml(list) {
  return list.map(function(b) {
    if (b.type === 'p') return '<p>' + sanitizeInline(b.html) + '</p>';
    if (b.type === 'h2') return '<h2 class="text-white font-bold text-lg mt-6">' + esc(b.text) + '</h2>';
    if (b.type === 'steps') {
      var startNum = b.start || 1;
      var lis = (b.items || []).filter(function(t) { return t.trim(); }).map(function(item, i) {
        return '<li class="flex gap-4 items-start"><span class="flex-shrink-0 w-7 h-7 rounded-full text-magenta-400 text-xs font-bold flex items-center justify-center mt-0.5" style="background:var(--tvn-accent-soft);">' + (startNum + i) + '</span><span>' + mdLiteToHtml(item) + '</span></li>';
      }).join('');
      return '<ol class="space-y-4 mt-4">' + lis + '</ol>';
    }
    if (b.type === 'tip') return '<div class="rounded-xl border border-magenta-500/20 px-5 py-4" style="background:rgba(233,30,140,0.05);"><p class="text-magenta-400 text-xs font-bold uppercase tracking-wide mb-1">Tip</p><p class="text-gray-400 text-sm">' + mdLiteToHtml(b.text) + '</p></div>';
    if (b.type === 'note') return '<div class="rounded-xl border border-amber-500/20 px-5 py-4" style="background:rgba(245,158,11,0.05);"><p class="text-amber-400 text-xs font-bold uppercase tracking-wide mb-1">Note</p><p class="text-gray-400 text-sm">' + mdLiteToHtml(b.text) + '</p></div>';
    if (b.type === 'image') return b.src ? ('<img src="' + esc(b.src) + '" alt="' + esc(b.alt) + '" class="rounded-xl w-full" loading="lazy">') : '';
    return b.html || ''; // raw
  }).filter(Boolean).join('\n');
}

function moveBlock(i, dir) {
  var j = i + dir;
  if (j < 0 || j >= blocks.length) return;
  var tmp = blocks[i]; blocks[i] = blocks[j]; blocks[j] = tmp;
  renderBlocks();
}
function removeBlock(i) {
  blocks.splice(i, 1);
  renderBlocks();
}

function renderBlocks() {
  var wrap = document.getElementById('f-blocks');
  wrap.innerHTML = '';
  if (!blocks.length) {
    wrap.innerHTML = '<div style="text-align:center;padding:20px;color:#9ca3af;font-size:12.5px;">No content yet — add a block below.</div>';
    return;
  }
  blocks.forEach(function(b, i) { wrap.appendChild(buildBlockCard(b, i)); });
}

function mkCtrlBtn(html, disabled, onClick) {
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.innerHTML = html;
  btn.disabled = !!disabled;
  if (disabled) btn.style.opacity = '.3';
  btn.addEventListener('click', onClick);
  return btn;
}

function buildBlockCard(b, i) {
  var card = document.createElement('div');
  card.className = 'block-card';

  var head = document.createElement('div');
  head.className = 'block-head';
  var label = document.createElement('span');
  label.className = 'block-label';
  label.textContent = BLOCK_LABELS[b.type] || b.type;
  var controls = document.createElement('div');
  controls.className = 'block-controls';
  controls.appendChild(mkCtrlBtn('&uarr;', i === 0, function() { moveBlock(i, -1); }));
  controls.appendChild(mkCtrlBtn('&darr;', i === blocks.length - 1, function() { moveBlock(i, 1); }));
  controls.appendChild(mkCtrlBtn('&times;', false, function() { removeBlock(i); }));
  head.appendChild(label);
  head.appendChild(controls);
  card.appendChild(head);
  card.appendChild(buildBlockBody(b, i));
  return card;
}

function buildStepRow(b, si) {
  var row = document.createElement('div');
  row.className = 'step-row';
  var badge = document.createElement('span');
  badge.textContent = (si + 1) + '.';
  badge.style.cssText = 'color:#9ca3af;font-size:12px;width:18px;flex-shrink:0;';
  var input = document.createElement('input');
  input.type = 'text';
  input.value = b.items[si] || '';
  input.placeholder = 'Step text… (use **bold** for emphasis, [text](url) for a link)';
  input.addEventListener('input', function() { b.items[si] = input.value; });
  var del = mkCtrlBtn('&times;', false, function() { b.items.splice(si, 1); renderBlocks(); });
  row.appendChild(badge);
  row.appendChild(input);
  row.appendChild(del);
  return row;
}

function buildBlockBody(b, i) {
  var box = document.createElement('div');

  if (b.type === 'p') {
    var toolbar = document.createElement('div');
    toolbar.className = 'rte-toolbar';
    var boldBtn = document.createElement('button'); boldBtn.type = 'button'; boldBtn.innerHTML = '<b>B</b>';
    var linkBtn = document.createElement('button'); linkBtn.type = 'button'; linkBtn.textContent = 'Link';
    var rte = document.createElement('div');
    rte.className = 'rte';
    rte.contentEditable = 'true';
    rte.setAttribute('data-placeholder', 'Write a paragraph…');
    rte.innerHTML = b.html || '';
    [boldBtn, linkBtn].forEach(function(btn) { btn.addEventListener('mousedown', function(e) { e.preventDefault(); }); });
    boldBtn.addEventListener('click', function() { rte.focus(); document.execCommand('bold'); b.html = rte.innerHTML; });
    linkBtn.addEventListener('click', function() {
      var url = prompt('Link URL:', 'https://');
      if (url) { rte.focus(); document.execCommand('createLink', false, url); b.html = rte.innerHTML; }
    });
    rte.addEventListener('input', function() { b.html = rte.innerHTML; });
    toolbar.appendChild(boldBtn);
    toolbar.appendChild(linkBtn);
    box.appendChild(toolbar);
    box.appendChild(rte);

  } else if (b.type === 'h2') {
    var input = document.createElement('input');
    input.type = 'text';
    input.value = b.text || '';
    input.placeholder = 'Section heading';
    input.addEventListener('input', function() { b.text = input.value; });
    box.appendChild(input);

  } else if (b.type === 'steps') {
    var list = document.createElement('div');
    (b.items || []).forEach(function(item, si) { list.appendChild(buildStepRow(b, si)); });
    box.appendChild(list);
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap;';
    var addStep = document.createElement('button');
    addStep.type = 'button';
    addStep.className = 'btn btn-secondary';
    addStep.style.cssText = 'padding:5px 10px;font-size:11.5px;';
    addStep.textContent = '+ Add step';
    addStep.addEventListener('click', function() { b.items.push(''); renderBlocks(); });
    row.appendChild(addStep);
    if (b.start && b.start !== 1) {
      var startLabel = document.createElement('label');
      startLabel.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:11px;color:#9ca3af;margin:0;text-transform:none;font-weight:600;';
      startLabel.textContent = 'Starts at #';
      var startInput = document.createElement('input');
      startInput.type = 'text';
      startInput.value = b.start;
      startInput.style.cssText = 'width:44px;padding:4px 6px;font-size:12px;';
      startInput.addEventListener('input', function() { b.start = parseInt(startInput.value, 10) || 1; });
      startLabel.appendChild(startInput);
      row.appendChild(startLabel);
    }
    box.appendChild(row);

  } else if (b.type === 'tip' || b.type === 'note') {
    var ta = document.createElement('textarea');
    ta.rows = 2;
    ta.value = b.text || '';
    ta.placeholder = (b.type === 'tip' ? 'Helpful tip text…' : 'Important note text…') + ' (use **bold** for emphasis)';
    ta.style.fontFamily = 'inherit';
    ta.style.fontSize = '13px';
    ta.addEventListener('input', function() { b.text = ta.value; });
    box.appendChild(ta);

  } else if (b.type === 'image') {
    var previewUrl = b.previewSrc || b.src;
    if (previewUrl) {
      var thumb = document.createElement('img');
      thumb.src = previewUrl;
      thumb.style.cssText = 'max-width:100%;max-height:180px;border-radius:8px;display:block;margin-bottom:8px;border:1px solid #e5e7eb;' + (b.uploading ? 'opacity:.5;' : '');
      box.appendChild(thumb);

      if (b.uploading) {
        var loading = document.createElement('div');
        loading.style.cssText = 'font-size:12px;color:#9ca3af;margin-bottom:8px;';
        loading.textContent = 'Uploading…';
        box.appendChild(loading);
      }

      var altInput = document.createElement('input');
      altInput.type = 'text';
      altInput.value = b.alt || '';
      altInput.placeholder = 'Describe the image (for accessibility)';
      altInput.style.marginBottom = '8px';
      altInput.disabled = b.uploading;
      altInput.addEventListener('input', function() { b.alt = altInput.value; });
      box.appendChild(altInput);

      var replaceBtn = document.createElement('button');
      replaceBtn.type = 'button';
      replaceBtn.className = 'btn btn-secondary';
      replaceBtn.style.cssText = 'padding:5px 10px;font-size:11.5px;';
      replaceBtn.disabled = b.uploading;
      replaceBtn.textContent = 'Replace image';
      replaceBtn.addEventListener('click', function() { triggerImagePicker(b); });
      box.appendChild(replaceBtn);
    } else {
      var pickBtn = document.createElement('button');
      pickBtn.type = 'button';
      pickBtn.className = 'btn btn-secondary';
      pickBtn.style.cssText = 'padding:8px 14px;font-size:12.5px;';
      pickBtn.textContent = 'Choose image…';
      pickBtn.addEventListener('click', function() { triggerImagePicker(b); });
      box.appendChild(pickBtn);
      var imgHint = document.createElement('div');
      imgHint.style.cssText = 'font-size:11px;color:#9ca3af;margin-top:6px;';
      imgHint.textContent = 'PNG, JPEG, GIF, or WebP — max 2MB.';
      box.appendChild(imgHint);
    }

  } else { // raw
    var hint = document.createElement('div');
    hint.style.cssText = 'font-size:11.5px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:6px 10px;margin-bottom:6px;';
    hint.textContent = "Raw HTML — for advanced content (tables, icons) that doesn't fit the simple blocks above.";
    var ta2 = document.createElement('textarea');
    ta2.rows = 6;
    ta2.value = b.html || '';
    ta2.style.fontFamily = "'SFMono-Regular', Consolas, monospace";
    ta2.style.fontSize = '12px';
    ta2.addEventListener('input', function() { b.html = ta2.value; });
    box.appendChild(hint);
    box.appendChild(ta2);
  }
  return box;
}

document.querySelectorAll('#editor-wrap [data-add]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    blocks.push(newBlock(btn.getAttribute('data-add')));
    renderBlocks();
  });
});

/* ── Image upload — one shared hidden <input type=file>, reused by every
   Image block's "Choose/Replace image" button. Uploads commit straight to
   the repo's uploads/ folder via /api/upload-image (same GitHub-backed
   pattern as article saves), and go live once Vercel's auto-deploy picks
   up the resulting commit — usually well under a minute. ─────────────── */
var imagePickerInput = document.createElement('input');
imagePickerInput.type = 'file';
imagePickerInput.accept = 'image/png,image/jpeg,image/gif,image/webp';
imagePickerInput.style.display = 'none';
document.body.appendChild(imagePickerInput);
var imagePickerTarget = null;

function triggerImagePicker(block) {
  imagePickerTarget = block;
  imagePickerInput.value = '';
  imagePickerInput.click();
}

imagePickerInput.addEventListener('change', function() {
  var file = imagePickerInput.files[0];
  var block = imagePickerTarget;
  if (!file || !block) return;
  if (file.size > 2 * 1024 * 1024) {
    showToast('Image is too large (max 2MB)', false);
    return;
  }
  var reader = new FileReader();
  reader.onload = function() {
    block.previewSrc = reader.result; // instant local preview — doesn't wait on the deploy
    block.uploading = true;
    renderBlocks();
    callApi({ filename: file.name, dataUrl: reader.result }, '/api/upload-image')
      .then(function(data) {
        block.src = data.path;
        block.uploading = false;
        renderBlocks();
      })
      .catch(function(err) {
        block.uploading = false;
        renderBlocks();
        showToast(err.message, false);
      });
  };
  reader.readAsDataURL(file);
});

/* ── Preview ──────────────────────────────────────────────────────── */
document.getElementById('f-preview').addEventListener('click', function() {
  document.getElementById('preview-title').textContent = document.getElementById('f-title').value || '(untitled)';
  document.getElementById('preview-body').innerHTML = serializeBlocksToHtml(blocksByLang[editLang]);
  document.getElementById('preview-wrap').style.display = 'flex';
});
document.getElementById('preview-close').addEventListener('click', function() {
  document.getElementById('preview-wrap').style.display = 'none';
});

/* ── Save / Delete / Upload — all go through password-gated endpoints
   which are the only place holding the GitHub token + real password
   check. A wrong password on any of them clears the stored one so the
   gate re-prompts. ──────────────────────────────────────────────────── */
function callApi(payload, endpoint) {
  return fetch(endpoint || '/api/save-article', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ password: PASSWORD }, payload))
  }).then(function(r) {
    return r.json().then(function(data) {
      if (!r.ok) throw new Error(data.error || ('Request failed (' + r.status + ')'));
      return data;
    });
  }).catch(function(err) {
    if (/incorrect password/i.test(err.message)) {
      try { sessionStorage.removeItem('tvn_cms_pw'); } catch (e) {}
      PASSWORD = null;
    }
    throw err;
  });
}

function hasBlockContent(list) {
  var body = serializeBlocksToHtml(list);
  return !!(body.replace(/<[^>]+>/g, '').trim() || list.some(function(b) { return b.type === 'image' && b.src; }));
}

document.getElementById('f-save').addEventListener('click', function() {
  titleByLang[editLang] = document.getElementById('f-title').value; // capture whatever tab is currently visible
  var slug = document.getElementById('f-slug').value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-');
  var titleEn = titleByLang.en.trim();
  var titleTh = titleByLang.th.trim();
  var catSlug = document.getElementById('f-catslug').value;
  var related = document.getElementById('f-related').value.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
  var bodyEn = serializeBlocksToHtml(blocksByLang.en);
  var bodyTh = serializeBlocksToHtml(blocksByLang.th);

  if (!slug) { showToast('Slug is required', false); return; }
  if (!titleEn) { showToast('English title is required (Thai can be filled in later)', false); return; }
  if ([].concat(blocksByLang.en, blocksByLang.th).some(function(b) { return b.type === 'image' && b.uploading; })) {
    showToast('Wait for the image upload to finish', false); return;
  }
  if (!hasBlockContent(blocksByLang.en)) { showToast('Add some English content first', false); return; }

  var saveBtn = document.getElementById('f-save');
  saveBtn.disabled = true; saveBtn.textContent = 'Saving…';

  callApi({
    slug: slug,
    article: {
      catSlug: catSlug,
      related: related,
      en: { title: titleEn, body: bodyEn },
      th: { title: titleTh, body: titleTh ? bodyTh : '' },
    }
  }).then(function(data) {
    showToast('Saved "' + data.slug + '"', true);
    closeEditor();
    loadArticles();
  }).catch(function(err) {
    showToast(err.message, false);
  }).finally(function() {
    saveBtn.disabled = false; saveBtn.textContent = 'Save';
  });
});

document.getElementById('f-delete').addEventListener('click', function() {
  if (!editingSlug) return;
  if (!confirm('Delete "' + editingSlug + '"? This commits the deletion straight to the repo and cannot be undone from here.')) return;

  var delBtn = document.getElementById('f-delete');
  delBtn.disabled = true; delBtn.textContent = 'Deleting…';

  callApi({ deleteSlug: editingSlug }).then(function() {
    showToast('Deleted "' + editingSlug + '"', true);
    closeEditor();
    loadArticles();
  }).catch(function(err) {
    showToast(err.message, false);
  }).finally(function() {
    delBtn.disabled = false; delBtn.textContent = 'Delete Article';
  });
});
</script>
</body>
</html>
